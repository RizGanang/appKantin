jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: shivammathur/setup-php@v2       # ← tambahkan ini
        with:
          php-version: '8.2'

      - name: Cek sintaks PHP                  # ← tambahkan ini
        run: |
          for f in $(find . -name '*.php'); do
            php -l "$f" || exit 1
          done

      - uses: docker/build-push-action@v6      # ← yang ini sudah ada
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appkantin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appkantin:${{ github.sha }}
